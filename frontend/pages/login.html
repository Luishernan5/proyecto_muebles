<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | Punto Venta Muebles</title>
    <link href="/vendor/bootstrap5/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center min-vh-100 py-4">
<div class="container" style="max-width: 440px">
    <div class="card shadow border-0">
        <div class="card-body p-4 p-md-5">
            <h1 class="h4 fw-bold mb-1">Iniciar sesión</h1>
            <p class="text-muted small mb-4">Clientes y administradores usan el mismo acceso; el sistema redirige según tu rol.</p>
            <form id="f-login" novalidate>
                <div class="mb-3">
                    <label class="form-label" for="email">Correo electrónico</label>
                    <input type="email" class="form-control" id="email" required autocomplete="username">
                </div>
                <div class="mb-3">
                    <label class="form-label" for="password">Contraseña</label>
                    <input type="password" class="form-control" id="password" required autocomplete="current-password">
                </div>
                <div id="err" class="alert alert-danger py-2 small d-none" role="alert"></div>
                <button type="submit" class="btn btn-dark w-100 py-2">Entrar</button>
            </form>
            <div class="d-grid gap-2 mt-3">
                <a href="/index.html" class="btn btn-outline-secondary btn-sm">Ir a la tienda sin iniciar sesión</a>
            </div>
            <p class="small text-center text-muted mt-4 mb-0">
                ¿No tienes cuenta? <a href="registro.html">Crear cuenta de cliente</a>
            </p>
            <p class="small text-center mt-2 mb-0">
                <a href="/index.html" class="text-decoration-none text-muted">Catálogo principal</a>
            </p>
        </div>
    </div>
</div>
<script src="/vendor/bootstrap5/bootstrap.bundle.min.js"></script>
<script>
(function () {
    var JWT_KEY = "pvm_jwt";
    function apiRoot() {
        return (window.PVM_API && String(window.PVM_API).replace(/\/$/, "")) || "/api";
    }
    function redirectSeguro(url, defecto) {
        if (!url || typeof url !== "string") return defecto;
        if (/^https?:/i.test(url) || url.indexOf("//") === 0) return defecto;
        if (url.charAt(0) !== "/") return defecto;
        return url;
    }
    document.getElementById("f-login").addEventListener("submit", function (ev) {
        ev.preventDefault();
        var err = document.getElementById("err");
        err.classList.add("d-none");
        var email = document.getElementById("email").value.trim();
        var password = document.getElementById("password").value;
        var q = new URLSearchParams(window.location.search);
        var pedido = redirectSeguro(q.get("redirect"), null);
        fetch(apiRoot() + "/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email: email, password: password }),
        })
            .then(function (r) {
                return r.json().then(function (body) {
                    if (!r.ok) {
                        throw new Error((body.error && body.error.message) || "Error " + r.status);
                    }
                    return body;
                });
            })
            .then(function (body) {
                var t = body.data && body.data.token;
                var u = body.data && body.data.usuario;
                if (!t || !u) throw new Error("Respuesta inválida del servidor");
                localStorage.setItem(JWT_KEY, t);
                if (u.rol === "admin") {
                    window.location.href = pedido || "/pages/admin/stock.html";
                } else {
                    window.location.href = pedido || "/index.html";
                }
            })
            .catch(function (e) {
                err.textContent = e.message || "No se pudo iniciar sesión";
                err.classList.remove("d-none");
            });
    });
})();
</script>
</body>
</html>
